    <style>
:root {
    --primary: #5b1025;
    --primary-hover: #74152f;
    --primary-light: rgba(91, 16, 37, 0.1);
    --primary-lighter: rgba(91, 16, 37, 0.05);
    --accent: #000000;
    --accent-light: rgba(139, 92, 246, 0.1);
    --success: #10b981;
    --warning: #f59e0b;
    --text: #1a1a1a;
    --text-muted: #6b7280;
    --text-light: #9ca3af;
    --bg: #ffffff;
    --bg-secondary: #f8fafc;
    --surface: #ffffff;
    --surface-hover: #f1f5f9;
    --border: #e2e8f0;
    --border-light: #f1f5f9;
    --glass: rgba(255, 255, 255, 0.8);
    --shadow-xs: 0 1px 2px 0 rgb(0 0 0 / 0.05);
    --shadow-sm: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
    --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
    --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
    --shadow-glow: 0 0 20px rgba(91, 16, 37, 0.3);
    --radius: 12px;
    --radius-sm: 8px;
    --radius-lg: 16px;
    --radius-xl: 20px;
    --gradient-primary: linear-gradient(135deg, #5b1025 0%, #74152f 100%);
    --gradient-accent: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%);
    --gradient-surface: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
    --particle-color: #b52e4c;
    --background-particle-color: #653744;
}

.dark-mode {
    --primary: #5b1025;
    --primary-hover: #74152f;
    --primary-light: rgba(91, 16, 37, 0.15);
    --primary-lighter: rgba(91, 16, 37, 0.08);
    --accent: #111111;
    --accent-light: rgba(17, 17, 17, 0.15);
    --success: #34d399;
    --warning: #fbbf24;
    --text: #f1f5f9;
    --text-muted: #94a3b8;
    --text-light: #64748b;
    --bg: #0b0b0b;
    --bg-secondary: #141414;
    --surface: #141414;
    --surface-hover: #242424;
    --border: #2b2b2b;
    --border-light: #383838;
    --glass: rgba(20, 20, 20, 0.8);
    --shadow-xs: 0 1px 2px 0 rgb(0 0 0 / 0.4);
    --shadow-sm: 0 1px 3px 0 rgb(0 0 0 / 0.5), 0 1px 2px -1px rgb(0 0 0 / 0.5);
    --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.5), 0 2px 4px -2px rgb(0 0 0 / 0.5);
    --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.6), 0 4px 6px -4px rgb(0 0 0 / 0.6);
    --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.7), 0 8px 10px -6px rgb(0 0 0 / 0.7);
    --shadow-glow: 0 0 20px rgba(91, 16, 37, 0.4);
    --gradient-primary: linear-gradient(135deg, #5b1025 0%, #81243d 100%);
    --gradient-accent: linear-gradient(135deg, #a855f7 0%, #9333ea 100%);
    --gradient-surface: linear-gradient(135deg, #141414 0%, #242424 100%);
    --particle-color: #b52e4c;
    --background-particle-color: #ffffff;
}

body.theme-wine {
    --primary: #5b1025;
    --primary-hover: #74152f;
    --primary-light: rgba(91, 16, 37, 0.15);
    --primary-lighter: rgba(91, 16, 37, 0.08);
    --particle-color: #b52e4c;
    --background-particle-color: #ffffff;
    --gradient-primary: linear-gradient(135deg, #5b1025 0%, #81243d 100%);
}

body.theme-blue {
    --primary: #287ca8;
    --primary-hover: #3996c4;
    --primary-light: rgba(40, 124, 168, 0.16);
    --primary-lighter: rgba(40, 124, 168, 0.08);
    --particle-color: #54b7e4;
    --background-particle-color: #ffffff;
    --gradient-primary: linear-gradient(135deg, #12354a 0%, #1d5575 100%);
}

body.theme-green {
    --primary: #387a58;
    --primary-hover: #4a956d;
    --primary-light: rgba(56, 122, 88, 0.16);
    --primary-lighter: rgba(56, 122, 88, 0.08);
    --particle-color: #6ed39a;
    --background-particle-color: #ffffff;
    --gradient-primary: linear-gradient(135deg, #193d2b 0%, #2b6442 100%);
}

body.theme-light {
    --primary: #8c2942;
    --primary-hover: #a53b56;
    --primary-light: rgba(140, 41, 66, 0.16);
    --primary-lighter: rgba(140, 41, 66, 0.08);
    --particle-color: #a72b46;
    --background-particle-color: #8a6870;
    --text: #1a1a1a;
    --text-muted: #6b7280;
    --text-light: #9ca3af;
    --bg: #f4f4f4;
    --bg-secondary: #e8e8e8;
    --surface: #ffffff;
    --surface-hover: #eeeeee;
    --border: #d6d6d6;
    --border-light: #e5e5e5;
    --glass: rgba(255, 255, 255, 0.8);
    --gradient-primary: linear-gradient(135deg, #f4f4f4 0%, #e8e8e8 100%);
    --gradient-surface: linear-gradient(135deg, #ffffff 0%, #f1f1f1 100%);
}

.theme-choice {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    margin: 0.5rem 0;
    padding: 0.75rem 1rem;
    border: 2px solid #e88732;
    border-radius: var(--radius-sm);
    background: var(--surface);
    color: var(--text);
    font: inherit;
    text-align: left;
    cursor: pointer;
    position: relative;
    overflow: hidden;
}

.theme-choice:hover,
.theme-choice:focus-visible {
    outline: none;
    border-color: var(--primary);
    background: var(--surface-hover);
}

.theme-choice.is-selected {
    border-color: #e88732;
    background: var(--surface);
    color: var(--primary);
    animation: selected-theme-text 1.8s ease-in-out infinite;
    box-shadow: 0 0 0 1px rgba(232, 135, 50, 0.35), 0 0 18px rgba(91, 16, 37, 0.35);
}

.theme-choice.is-selected .theme-swatch {
    border: 2px solid #fff;
}

@keyframes selected-theme-text {
    0%, 100% { text-shadow: 0 0 2px rgba(232, 135, 50, 0.2); }
    50% { text-shadow: 0 0 10px rgba(232, 135, 50, 0.75); }
}

.intro-screen {
    position: fixed;
    inset: 0;
    z-index: 3000;
    display: grid;
    place-items: center;
    overflow: hidden;
    background: rgba(0, 0, 0, 0.96);
    color: #f5f5f5;
    transition: opacity 0.65s ease;
}

.intro-screen.leaving {
    opacity: 0;
    pointer-events: none;
}

.intro-screen[hidden],
.intro-screen [hidden] {
    display: none !important;
}

.intro-content {
    position: relative;
    z-index: 1;
    width: min(92vw, 680px);
    text-align: center;
    display: grid;
    justify-items: center;
}

.intro-actions {
    display: grid;
    justify-items: center;
    gap: 1rem;
    width: min(100%, 320px);
}

.intro-actions[hidden],
.intro-stage[hidden],
#introMessage[hidden] {
    display: none !important;
}

.intro-warning {
    width: min(100%, 440px);
    margin: 0 0 1.5rem;
    padding: 0.7rem 0.9rem;
    border: 1px solid rgba(232, 135, 50, 0.7);
    background: rgba(45, 28, 10, 0.58);
    color: #f3c17e;
    font: 700 0.78rem/1.5 "Press Start 2P", "Courier New", Consolas, monospace;
    letter-spacing: 0.035em;
    text-align: center;
    text-transform: uppercase;
}

.intro-action {
    position: relative;
    width: 100%;
    padding: 0.85rem 1.25rem;
    border: 2px solid rgba(255, 255, 255, 0.28);
    border-radius: 4px;
    background: rgba(14, 14, 14, 0.94);
    color: #b9beca;
    font: 900 clamp(1.2rem, 4vw, 1.65rem)/1.4 "Press Start 2P", "Courier New", Consolas, monospace;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    text-shadow: 2px 0 0 #171717, -2px 0 0 #171717, 0 2px 0 #171717, 0 -2px 0 #171717;
    -webkit-font-smoothing: none;
    font-smooth: never;
    text-rendering: geometricPrecision;
    cursor: pointer;
    transition: transform 0.18s ease, border-color 0.18s ease, color 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
    animation: retro-text-glow 3s ease-in-out infinite;
}

.intro-action::before {
    content: "";
    position: absolute;
    left: 1rem;
    color: #e88732;
    opacity: 0;
    transform: translateX(-6px);
    transition: opacity 0.18s ease, transform 0.18s ease;
}

.intro-action.is-selected {
    border-color: #e88732;
    background: linear-gradient(100deg, rgba(91, 16, 37, 0.88), rgba(25, 17, 22, 0.96));
    color: #fff;
    text-shadow: 0 0 2px #fff, 0 0 8px rgba(255, 255, 255, 0.95), 0 0 18px rgba(255, 255, 255, 0.72);
    box-shadow: 0 0 0 2px rgba(232, 135, 50, 0.14), 0 0 20px rgba(232, 135, 50, 0.2);
    transform: scale(1.045);
    animation: selected-menu-pulse 1.8s ease-in-out infinite;
}

.intro-action.is-selected::before {
    content: "▶";
    color: #fff;
    text-shadow: 0 0 8px #fff, 0 0 16px rgba(255, 255, 255, 0.8);
    opacity: 1;
    transform: translateX(0);
}

.intro-action:focus-visible {
    outline: 2px solid #fff;
    outline-offset: 5px;
}

@keyframes retro-text-glow {
    0%, 100% { text-shadow: 2px 0 0 #171717, -2px 0 0 #171717, 0 2px 0 #171717, 0 -2px 0 #171717; }
    50% { text-shadow: 2px 0 0 #171717, -2px 0 0 #171717, 0 2px 0 #171717, 0 -2px 0 #171717, 0 0 8px rgba(255, 255, 255, 0.28); }
}

@keyframes selected-menu-pulse {
    0%, 100% {
        box-shadow: 0 0 0 2px rgba(232, 135, 50, 0.12), 0 0 14px rgba(232, 135, 50, 0.16);
        text-shadow: 0 0 2px #fff, 0 0 8px rgba(255, 255, 255, 0.85), 0 0 16px rgba(255, 255, 255, 0.58);
    }
    50% {
        box-shadow: 0 0 0 3px rgba(232, 135, 50, 0.28), 0 0 24px rgba(232, 135, 50, 0.32);
        text-shadow: 0 0 3px #fff, 0 0 12px #fff, 0 0 24px rgba(255, 255, 255, 0.9);
    }
}

.intro-stage {
    min-height: 220px;
    display: grid;
    place-items: center;
}

.intro-letters {
    font-size: clamp(3.5rem, 14vw, 8rem);
    font-weight: 900;
    letter-spacing: 0.2em;
}

.intro-spinner {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: repeating-conic-gradient(#fff 0deg 7deg, transparent 7deg 30deg);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 4px));
    mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 4px));
    animation: intro-spin 0.9s linear infinite;
}

@keyframes intro-spin {
    to { transform: rotate(360deg); }
}

.intro-code-panel {
    position: fixed;
    inset: 0;
    z-index: 2;
    width: 100%;
    height: 100%;
    padding: clamp(1rem, 4vw, 3rem);
    overflow: hidden;
    border: 0;
    border-radius: 0;
    background: #080b0a;
    color: #a8e6bd;
    text-align: left;
    animation: code-screen-arrive 0.5s ease both;
}

.intro-code-panel p {
    margin: 0 0 1.2rem;
    color: #e88732;
    font: 700 clamp(0.65rem, 1.5vw, 0.85rem)/1.8 "Press Start 2P", "Courier New", Consolas, monospace;
    letter-spacing: 0.1em;
    text-transform: uppercase;
}

#introCode {
    margin: 0;
    overflow: hidden;
    white-space: pre-wrap;
    color: #a8e6bd;
    font: clamp(0.65rem, 1.4vw, 0.9rem)/1.8 "Press Start 2P", "Courier New", Consolas, monospace;
    overflow-wrap: anywhere;
    text-shadow: 0 0 8px rgba(168, 230, 189, 0.22);
}

.intro-code-cursor {
    display: inline-block;
    width: 0.65em;
    height: 1em;
    margin-left: 0.12em;
    vertical-align: -0.12em;
    background: #a8e6bd;
    animation: code-cursor-blink 0.9s steps(2, start) infinite;
}

@keyframes code-screen-arrive {
    from { opacity: 0; }
    to { opacity: 1; }
}

@keyframes code-cursor-blink {
    to { opacity: 0; }
}

#introMessage {
    min-height: 1.5em;
    margin: 1rem 0 0;
    color: rgba(255, 255, 255, 0.8);
    font-size: 0.9rem;
}

@media (prefers-reduced-motion: reduce) {
    .theme-choice.is-selected,
    .intro-spinner,
    .intro-action,
    .intro-action.is-selected,
    .intro-code-cursor {
        animation: none;
    }
    .intro-screen {
        transition: none;
    }
    .intro-action,
    .intro-action::before {
        transition: none;
    }
}

.theme-swatch {
    width: 1rem;
    height: 1rem;
    border-radius: 50%;
    background: var(--swatch-color);
}

* {
    box-sizing: border-box;
}

html {
    overflow-x: hidden;
}

.particle-background {
    position: fixed;
    inset: 0;
    z-index: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

body {
    font-family: "Press Start 2P", "Courier New", Consolas, monospace;
    font-size: 12px;
    line-height: 1.8;
    margin: 0;
    padding: 0 0 0 64px;
    overflow-x: hidden;
    background: var(--bg);
    color: var(--text);
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}

button,
input,
select,
textarea {
    font-family: inherit;
}

header,
main,
footer {
    position: relative;
    z-index: 1;
}

header {
    background: transparent;
    color: var(--text);
    z-index: 100;
}

.header-content {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0.25rem 1rem;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 1.5rem;
}

.header-actions {
    display: flex;
    align-items: center;
    gap: 0.75rem;
}

.header-actions button {
    padding: 0.75rem 1rem;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--text);
    font-size: 15px;
    cursor: pointer;
}

.header-actions button:hover {
    background: var(--surface-hover);
}

.left-taskbar {
    position: fixed;
    inset: 0 auto 0 0;
    z-index: 150;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    width: 64px;
    padding: 1rem 0.5rem;
    overflow: hidden;
    background: var(--surface);
    color: var(--text);
    border-right: 1px solid var(--border);
    transition: width 0.2s ease;
}

.left-taskbar:hover,
.left-taskbar:focus-within {
    width: 200px;
}

#searchView[hidden] {
    display: none !important;
}

.taskbar-button {
    display: flex;
    align-items: center;
    flex-direction: row-reverse;
    justify-content: space-between;
    flex: 0 0 48px;
    width: 100%;
    padding: 0 4px;
    border: 0;
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--text);
    font-size: 15px;
    cursor: pointer;
    text-align: left;
}

.taskbar-button:hover,
.taskbar-button:focus-visible {
    outline: none;
    background: var(--surface-hover);
}

.taskbar-icon {
    display: block;
    box-sizing: border-box;
    width: 40px;
    height: 40px;
    flex: 0 0 40px;
    padding: 8px;
    border: 1px solid var(--border);
    border-radius: 50%;
    background: var(--bg-secondary);
}

.taskbar-label {
    overflow: hidden;
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.15s ease;
}

.left-taskbar:hover .taskbar-label,
.left-taskbar:focus-within .taskbar-label {
    opacity: 1;
}

#searchView {
    min-height: 70vh;
}

.search-view-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    margin-bottom: 1rem;
}

.search-view-heading h1 {
    margin: 0;
}

#closeSearchButton {
    padding: 0.65rem 1rem;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
}

#searchFrame {
    display: block;
    width: 100%;
    height: 70vh;
    min-height: 420px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: white;
}

.particle-hero {
    min-height: 195px;
    display: grid;
    place-items: center;
    margin: 0 auto 0.5rem;
}

#titleParticles {
    display: block;
    width: 100%;
    height: 195px;
}

.visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
}

#sortOptions {
    padding: 0.45rem 0.75rem;
    border: 0;
    border-radius: var(--radius);
    background: var(--glass);
    backdrop-filter: blur(20px);
    color: var(--text-muted);
    font-size: 15px;
    cursor: pointer;
    outline: none;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    min-width: 130px;
    box-shadow: var(--shadow-sm);
}

#sortOptions:hover {
    background: var(--text);
    transform: translateY(-1px);
    box-shadow: var(--shadow);
    color: var(--glass);
}

main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 1rem 2rem;
}

.game-search {
    display: block;
    width: 100%;
    margin: 0 0 1rem;
    padding: 0.875rem 1rem;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    outline: none;
    background: var(--surface);
    color: var(--text);
    font: inherit;
    box-shadow: var(--shadow-sm);
}

.game-search:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-light);
}

.game-search::placeholder {
    color: var(--text-muted);
}

#zoneCount {
    margin: 0 0 1.5rem;
    font-size: 14px;
    color: var(--text-muted);
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 0.5rem;
}

#zoneCount::before {
    content: '';
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--primary);
}

#container,
#featuredZones {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 1.5rem;
}

.zone-item {
    background: var(--gradient-surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
    cursor: pointer;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    flex-direction: column;
    position: relative;
    box-shadow: var(--shadow-sm);
}

.zone-item:hover {
    transform: translateY(-8px) scale(1.02);
    box-shadow: var(--shadow-xl);
    border-color: var(--primary);
}

.zone-item:hover::before {
    opacity: 1;
}

.zone-item::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--primary-light);
    opacity: 0;
    transition: opacity 0.4s ease;
    pointer-events: none;
    z-index: 1;
}

.zone-item img {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    display: block;
    background: var(--border-light);
    transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

.zone-item:hover img {
    transform: scale(1.05);
}

.zone-item button {
    background: transparent;
    color: var(--text);
    border: 0;
    padding: 1.25rem 1rem;
    cursor: pointer;
    font-weight: 600;
    font-size: 14px;
    line-height: 1.4;
    text-align: center;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    min-height: 70px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    z-index: 2;
}

.zone-item:hover button {
    color: var(--primary);
    background: rgba(91, 16, 37, 0.05);
}

#zoneViewer {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 1000;
    display: none;
    flex-direction: column;
    animation: slideInUp 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

@keyframes slideInUp {
    from {
        transform: translateY(100%);
    }
    to {
        transform: translateY(0);
    }
}

.zone-header {
    background: var(--gradient-primary);
    color: white;
    padding: 1rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: var(--shadow-lg);
}

.zone-title {
    flex: 1;
    min-width: 0;
}

#zoneName {
    font-size: 1.25rem;
    font-weight: 700;
    margin: 0 0 0.25rem;
    line-height: 1.3;
}

#zoneId {
    display: none;
}

#zoneAuthor {
    font-size: 14px;
    color: rgba(255, 255, 255, 0.8);
    text-decoration: none;
    transition: all 0.2s ease;
    font-weight: 500;
}

#zoneAuthor:hover {
    color: white;
    text-decoration: underline;
}

.zone-controls {
    display: flex;
    gap: 0.75rem;
}

.zone-controls button {
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.3);
    color: white;
    padding: 0.625rem 1rem;
    border-radius: var(--radius);
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    backdrop-filter: blur(20px);
}

.zone-controls button:hover {
    background: rgba(255, 255, 255, 0.2);
    border-color: rgba(255, 255, 255, 0.5);
    transform: translateY(-1px);
    box-shadow: var(--shadow);
}

#zoneFrame {
    flex-grow: 1;
    border: none;
    width: 100%;
    min-height: 0;
}

#popupOverlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(8px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 2000;
    padding: 1rem;
    animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
    from {
        opacity: 0;
    }
    to {
        opacity: 1;
    }
}

.popup {
    background: var(--surface);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-xl);
    width: 100%;
    max-width: 520px;
    max-height: 80vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    border: 1px solid var(--border);
    animation: slideInScale 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

@keyframes slideInScale {
    from {
        transform: scale(0.9) translateY(20px);
        opacity: 0;
    }
    to {
        transform: scale(1) translateY(0);
        opacity: 1;
    }
}

.popup-header {
    background: var(--gradient-primary);
    color: white;
    padding: 1.25rem 1.5rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

#popupTitle {
    margin: 0;
    font-size: 1.25rem;
    font-weight: 700;
}

#popupClose {
    background: rgba(255, 255, 255, 0.1);
    border: 0;
    color: white;
    font-size: 1.25rem;
    cursor: pointer;

    border-radius: var(--radius);

    height: 36px;

#popupClose:hover {

#popupBody {
    padding: 1.5rem;
    overflow-y: auto;
    color: var(--text);
}

#popupBody input[type="text"],
#popupBody input[type="file"] {
    width: 100%;
    padding: 0.875rem 1rem;
    margin-bottom: 1.25rem;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--bg-secondary);

}

#popupBody input[type="text"]:focus,
#popupBody input[type="file"]:focus {

#settings-button {
    width: 100%;

    color: white;
    border: 0;
    border-radius: var(--radius);
    cursor: pointer;
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 1rem;

}

#settings-button:hover {
    transform: translateY(-2px);

#settings-button:active {

}

footer {
    background: var(--bg-secondary);
    border-top: 1px solid var(--border);

    margin-top: 3rem;
    text-align: center;
}

.footer-links {
    display: flex;

}

.footer-links a {
    color: var(--primary);

    font-weight: 600;

}

.footer-links a:hover {

@media (max-width: 768px) {

        flex-direction: row;
        gap: 0.5rem;

}

    }

    <script>
        const container = document.getElementById('container');
const zoneViewer = document.getElementById('zoneViewer');
let zoneFrame = document.getElementById('zoneFrame');
const sortOptions = document.getElementById('sortOptions');
const zonesurls = [
    "https://cdn.jsdelivr.net/gh/gn-math/assets@main/zones.json",
    "https://cdn.jsdelivr.net/gh/gn-math/assets@latest/zones.json",
    "https://cdn.jsdelivr.net/gh/gn-math/assets@master/zones.json",
    "https://cdn.jsdelivr.net/gh/gn-math/assets/zones.json"
];
let zonesURL = zonesurls[Math.floor(Math.random() * zonesurls.length)];
const coverURL = "https://cdn.jsdelivr.net/gh/gn-math/covers@main";
const htmlURL = "https://cdn.jsdelivr.net/gh/gn-math/html@main";
let zones = [];
let popularityData = {};
const featuredContainer = document.getElementById('featuredZones');
async function listZones() {
    try {
      let sharesponse;
      let shajson;
      let sha;
        try {
          sharesponse = await fetch("https://api.github.com/repos/gn-math/assets/commits?t="+Date.now());
        } catch (error) {}
        if (sharesponse && sharesponse.status === 200) {
          try {
            shajson = await sharesponse.json();
            sha = shajson[0]['sha'];
            if (sha) {
                zonesURL = `https://cdn.jsdelivr.net/gh/gn-math/assets@${sha}/zones.json`;
            }
          } catch (error) {
            try {
                let secondarysharesponse = await fetch("https://raw.githubusercontent.com/gn-math/xml/refs/heads/main/sha.txt?t="+Date.now());
                if (secondarysharesponse && secondarysharesponse.status === 200) {
                    sha = (await secondarysharesponse.text()).trim();
                    if (sha) {
                        zonesURL = `https://cdn.jsdelivr.net/gh/gn-math/assets@${sha}/zones.json`;
                    }
                }
            } catch(error) {}
          }
        }
        const zoneSources = [
            zonesURL,
            ...zonesurls,
            "https://raw.githubusercontent.com/gn-math/assets/main/zones.json"
        ].filter((url, index, urls) => urls.indexOf(url) === index);
        let lastLoadError;
        for (const source of zoneSources) {
            try {
                const response = await fetch(source + "?t=" + Date.now());
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status} from ${source}`);
                }
                const json = await response.json();
                if (!Array.isArray(json) || json.length === 0) {
                    throw new Error(`Invalid zones data from ${source}`);
                }
                zones = json;
                break;
            } catch (error) {
                lastLoadError = error;
            }
        }
        if (zones.length === 0) {
            throw new Error(`All zone sources failed. ${lastLoadError || "No zone data available."}`);
        }
        zones[0].featured = true;
        await fetchPopularity();
        sortZones();
        const search = new URLSearchParams(window.location.search);
        const id = search.get('id');
        if (id) {
            const zone = zones.find(zone => zone.id + '' === id);
            if (zone) {
                openZone(zone);
            }
        }
    } catch (error) {
        console.error(error);
        container.innerHTML = `Error loading zones: ${error}`;
    }
}
async function fetchPopularity() {
    try {
        const response = await fetch("https://data.jsdelivr.com/v1/stats/packages/gh/gn-math/html@main/files?period=year");
        const data = await response.json();
        data.forEach(file => {
            const idMatch = file.name.match(/\/(\d+)\.html$/);
            if (idMatch) {
                const id = parseInt(idMatch[1]);
                popularityData[id] = file.hits.total;
            }
        });
    } catch (error) {
        popularityData[0] = 0;
    }
}

function sortZones() {
    const sortBy = sortOptions.value;
    if (sortBy === 'name') {
        zones.sort((a, b) => a.name.localeCompare(b.name));
    } else if (sortBy === 'id') {
        zones.sort((a, b) => a.id - b.id);
    } else if (sortBy === 'popular') {
        zones.sort((a, b) => (popularityData[b.id] || 0) - (popularityData[a.id] || 0));
    }
    zones.sort((a, b) => (a.id === -1 ? -1 : b.id === -1 ? 1 : 0));
    filterZones();
}

function displayFeaturedZones(featuredZones) {
    featuredContainer.innerHTML = "";
    featuredZones.forEach((file, index) => {
        const zoneItem = document.createElement("div");
        zoneItem.className = "zone-item";
        zoneItem.onclick = () => openZone(file);
        const img = document.createElement("img");
        img.dataset.src = file.cover.replace("{COVER_URL}", coverURL).replace("{HTML_URL}", htmlURL);
        img.alt = file.name;
        img.loading = "lazy";
        img.className = "lazy-zone-img";
        img.onerror = () => {
            const rawUrl = img.src.replace("https://cdn.jsdelivr.net/gh/gn-math/covers@main/", "https://raw.githubusercontent.com/gn-math/covers/main/");
            if (rawUrl !== img.src) {
                img.onerror = null;
                img.src = rawUrl;
            }
        };
        zoneItem.appendChild(img);
        const button = document.createElement("button");
        button.textContent = file.name;
        button.onclick = (event) => {
            event.stopPropagation();
            openZone(file);
        };
        zoneItem.appendChild(button);
        featuredContainer.appendChild(zoneItem);
    });
    if (featuredContainer.innerHTML === "") {
        featuredContainer.innerHTML = "No featured zones found.";
    }
    document.getElementById("allZonesSummary").textContent = `Featured Zones (${featuredZones.length})`;

    const lazyImages = document.querySelectorAll('#featuredZones img.lazy-zone-img');
    const imageObserver = new IntersectionObserver((entries, observer) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                const img = entry.target;
                img.src = img.dataset.src;
                img.classList.remove("lazy-zone-img");
                observer.unobserve(img);
            }
        });
    }, {
        rootMargin: "100px", 
        threshold: 0.1
    });

    lazyImages.forEach(img => {
        imageObserver.observe(img);
    });
}

function displayZones(zones) {
    container.innerHTML = "";
    zones.forEach((file, index) => {
        const zoneItem = document.createElement("div");
        zoneItem.className = "zone-item";
        zoneItem.onclick = () => openZone(file);
        const img = document.createElement("img");
        img.dataset.src = file.cover.replace("{COVER_URL}", coverURL).replace("{HTML_URL}", htmlURL);
        img.alt = file.name;
        img.loading = "lazy";
        img.className = "lazy-zone-img";
        img.onerror = () => {
            const rawUrl = img.src.replace("https://cdn.jsdelivr.net/gh/gn-math/covers@main/", "https://raw.githubusercontent.com/gn-math/covers/main/");
            if (rawUrl !== img.src) {
                img.onerror = null;
                img.src = rawUrl;
            }
        };
        zoneItem.appendChild(img);
        const button = document.createElement("button");
        button.textContent = file.name;
        button.onclick = (event) => {
            event.stopPropagation();
            openZone(file);
        };
        zoneItem.appendChild(button);
        container.appendChild(zoneItem);
    });
    if (container.innerHTML === "") {
        container.innerHTML = "No zones found.";
    }
    document.getElementById("allSummary").textContent = `All Zones (${zones.length})`;

    const lazyImages = document.querySelectorAll('img.lazy-zone-img');
    const imageObserver = new IntersectionObserver((entries, observer) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                const img = entry.target;
                img.src = img.dataset.src;
                img.classList.remove("lazy-zone-img");
                observer.unobserve(img);
            }
        });
    }, {
        rootMargin: "100px", 
        threshold: 0.1
    });

    lazyImages.forEach(img => {
        imageObserver.observe(img);
    });
}

function filterZones() {
    const query = document.getElementById("gameSearchBar").value.trim().toLowerCase();
    const matchingZones = zones.filter(zone => zone.name.toLowerCase().includes(query));
    displayFeaturedZones(matchingZones.filter(zone => zone.featured));
    displayZones(matchingZones);
}

async function openZone(file) {
    if (zoneFrame.isConnected) {
        zoneFrame.remove();
    }
    zoneFrame = document.createElement("iframe");
    zoneFrame.id = "zoneFrame";
    zoneFrame.name = "zoneFrame";
    zoneFrame.title = file.name;
    zoneViewer.appendChild(zoneFrame);

    document.getElementById('zoneName').textContent = file.name;
    document.getElementById('zoneId').textContent = file.id;
    const authorLink = document.getElementById('zoneAuthor');
    authorLink.textContent = "by " + file.author;
    authorLink.href = file.authorLink || "#";
    zoneViewer.style.display = "flex";

    const pageUrl = new URL(window.location);
    pageUrl.searchParams.set('id', file.id);
    history.pushState(null, '', pageUrl.toString());

    if (/^https?:\/\//i.test(file.url)) {
        zoneFrame.src = file.url;
        return;
    }

    const url = file.url.replace("{COVER_URL}", coverURL).replace("{HTML_URL}", htmlURL);
    try {
        const response = await fetch(url + "?t=" + Date.now());
        if (!response.ok) {
            throw new Error(`HTTP ${response.status} while loading ${file.name}`);
        }
        const html = await response.text();
        const frameDocument = zoneFrame.contentDocument;
        if (!frameDocument) {
            throw new Error(`Could not access the game frame for ${file.name}`);
        }
        frameDocument.open();
        frameDocument.write(html);
        frameDocument.close();
    } catch (error) {
        console.error(`Failed to load zone "${file.name}":`, error);
        zoneFrame.srcdoc = `<p style="font:16px sans-serif;padding:1rem">Could not load this game. Please try again.</p>`;
    }
}

function openZoneInSite() {
    const currentZone = zones.find(zone => String(zone.id) === document.getElementById('zoneId').textContent);
    if (!currentZone) {
        throw new Error("No game is currently selected.");
    }
    openZone(currentZone);
}

function closeZone() {
    zoneViewer.style.display = "none";
    if (zoneFrame.isConnected) {
        zoneFrame.remove();
    }
    const url = new URL(window.location);
    url.searchParams.delete('id');
    history.pushState(null, '', url.toString());
}

function downloadZone() {
    let zone = zones.find(zone => zone.id + '' === document.getElementById('zoneId').textContent);
    fetch(zone.url.replace("{HTML_URL}", htmlURL)+"?t="+Date.now()).then(res => res.text()).then(text => {
        const blob = new Blob([text], {

function sanitizeData(obj, maxStringLen = 1000, maxArrayLen = 10000) {
    if (typeof obj === 'string') {
      return obj.length > maxStringLen ? obj.slice(0, maxStringLen) + '...[truncated]' : obj;
    }
    
    if (obj instanceof Uint8Array) {
      if (obj.length > maxArrayLen) {
        return `[Uint8Array too large (${obj.length} bytes), truncated]`;
      }
      return obj;
    }
    
    if (Array.isArray(obj)) {
      return obj.map(item => sanitizeData(item, maxStringLen, maxArrayLen));
    }
    
    if (obj && typeof obj === 'object') {
      const newObj = {};
      for (const key in obj) {
        if (obj.hasOwnProperty(key)) {
          newObj[key] = sanitizeData(obj[key], maxStringLen, maxArrayLen);
        }
      }
      return newObj;
    }
    
    return obj;
  }

async function saveData() {
    alert("This might take a while, dont touch anything other than this OK button");
    const result = {};
    result.cookies = document.cookie;
    result.localStorage = {...localStorage};
    result.sessionStorage = {...sessionStorage};
    result.indexedDB = {};
    const dbs = await indexedDB.databases();
    for (const dbInfo of dbs) {
      if (!dbInfo.name) continue;
      result.indexedDB[dbInfo.name] = {};
      await new Promise((resolve, reject) => {
        const openRequest = indexedDB.open(dbInfo.name, dbInfo.version);
        openRequest.onerror = () => reject(openRequest.error);
        openRequest.onsuccess = () => {
          const db = openRequest.result;
          const storeNames = Array.from(db.objectStoreNames);
          if (storeNames.length === 0) {
            resolve();
            return;
          }
          const transaction = db.transaction(storeNames, "readonly");
          const storePromises = [];
          for (const storeName of storeNames) {
            result.indexedDB[dbInfo.name][storeName] = [];
            const store = transaction.objectStore(storeName);
            const getAllRequest = store.getAll();
            const p = new Promise((res, rej) => {
              getAllRequest.onsuccess = () => {
                result.indexedDB[dbInfo.name][storeName] = sanitizeData(getAllRequest.result, 1000, 100);
                res();
              };
              getAllRequest.onerror = () => rej(getAllRequest.error);
            });
            storePromises.push(p);
          }
          Promise.all(storePromises).then(() => resolve());
        };
      });
    }

    result.caches = {};
    const cacheNames = await caches.keys();
    for (const cacheName of cacheNames) {
      const cache = await caches.open(cacheName);
      const requests = await cache.keys();
      result.caches[cacheName] = [];
      for (const req of requests) {
        const response = await cache.match(req);
        if (!response) continue;
        const cloned = response.clone();
        const contentType = cloned.headers.get('content-type') || '';
        let body;
        try {
          if (contentType.includes('application/json')) {
            body = await cloned.json();
          } else if (contentType.includes('text') || contentType.includes('javascript')) {
            body = await cloned.text();
          } else {
            const buffer = await cloned.arrayBuffer();
            body = btoa(String.fromCharCode(...new Uint8Array(buffer)));
          }
        } catch (e) {
          body = '[Unable to read body]';
        }
        result.caches[cacheName].push({
          url: req.url,
          body,
          contentType
        });
      }
    }
  
    alert("Done, wait for the download to come");
    const link = document.createElement("a");
    link.href = URL.createObjectURL(new Blob([JSON.stringify(result)], {
        type: "text/plain"
    }));
    link.download = `${Date.now()}.data`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }
  
  async function loadData(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async function (e) {
        const data = JSON.parse(e.target.result);
        if (data.cookies) {
            data.cookies.split(';').forEach(cookie => {
              document.cookie = cookie.trim();
            });
          }
        
          if (data.localStorage) {
            for (const key in data.localStorage) {
              localStorage.setItem(key, data.localStorage[key]);
            }
          }
        
          if (data.sessionStorage) {
            for (const key in data.sessionStorage) {
              sessionStorage.setItem(key, data.sessionStorage[key]);
            }
          }
        
          if (data.indexedDB) {
            for (const dbName in data.indexedDB) {
              const stores = data.indexedDB[dbName];
              await new Promise((resolve, reject) => {
                const request = indexedDB.open(dbName, 1);
                request.onupgradeneeded = e => {
                  const db = e.target.result;
                  for (const storeName in stores) {
                    if (!db.objectStoreNames.contains(storeName)) {
                      db.createObjectStore(storeName, { keyPath: 'id', autoIncrement: true });
                    }
                  }
                };
                request.onsuccess = e => {
                  const db = e.target.result;
                  const transaction = db.transaction(Object.keys(stores), 'readwrite');
                  transaction.onerror = () => reject(transaction.error);
                  let pendingStores = Object.keys(stores).length;
        
                  for (const storeName in stores) {
                    const objectStore = transaction.objectStore(storeName);
                    objectStore.clear().onsuccess = () => {
                      for (const item of stores[storeName]) {
                        objectStore.put(item);
                      }
                      pendingStores--;
                      if (pendingStores === 0) resolve();
                    };
                  }
                };
                request.onerror = () => reject(request.error);
              });
            }
          }
        
          if (data.caches) {
            for (const cacheName in data.caches) {
              const cache = await caches.open(cacheName);
              await cache.keys().then(keys => Promise.all(keys.map(k => cache.delete(k)))); // clear existing
        
              for (const entry of data.caches[cacheName]) {
                let responseBody;
                if (entry.contentType.includes('application/json')) {
                  responseBody = JSON.stringify(entry.body);
                } else if (entry.contentType.includes('text') || entry.contentType.includes('javascript')) {
                  responseBody = entry.body;
                } else {
                  const binaryStr = atob(entry.body);
                  const len = binaryStr.length;
                  const bytes = new Uint8Array(len);
                  for (let i = 0; i < len; i++) {
                    bytes[i] = binaryStr.charCodeAt(i);
                  }
                  responseBody = bytes.buffer;
                }
                const headers = new Headers({ 'content-type': entry.contentType });
                const response = new Response(responseBody, { headers });
                await cache.put(entry.url, response);
              }
            }
          }
        alert("Data loaded");
    };
    alert("This might take a while, dont touch anything other than this OK button");
    reader.readAsText(file);
  }

function buildIntroScreen() {
    const introScreen = document.createElement('div');
    introScreen.id = 'introScreen';
    introScreen.className = 'intro-screen';
    introScreen.setAttribute('aria-live', 'polite');
    introScreen.tabIndex = -1;
    introScreen.innerHTML = `
        <div class="intro-content">
            <div class="intro-stage" id="introStage" hidden></div>
            <p id="introMessage" aria-live="polite" hidden></p>
            <p class="intro-warning" id="introWarning">Warning: Intro animations include motion effects. Rapid flashing is not used. Stop if you feel discomfort.</p>
            <div class="intro-actions" id="introActions" role="group" aria-label="Main menu. Use the up and down arrows or W and S to move, then Enter to choose.">
                <button class="intro-action is-selected" type="button" id="playIntroButton" aria-pressed="true">Play</button>
                <button class="intro-action" type="button" id="quitIntroButton" aria-pressed="false">Quit</button>
            </div>
        </div>
    `;
    document.body.appendChild(introScreen);

    const introOptions = [...introScreen.querySelectorAll('.intro-action')];
    let selectedIndex = 0;
    const selectOption = index => {
        selectedIndex = (index + introOptions.length) % introOptions.length;
        introOptions.forEach((option, optionIndex) => {
            const selected = optionIndex === selectedIndex;
            option.classList.toggle('is-selected', selected);
            option.setAttribute('aria-pressed', String(selected));
        });
    };
    const activateOption = () => {
        if (selectedIndex === 0) {
            startIntroSequence();
            return;
        }
        window.close();
        const message = document.getElementById('introMessage');
        message.hidden = false;
        message.textContent = 'The browser may block automatic tab closing. If it stays open, close this tab manually.';
    };

    introOptions.forEach((option, index) => {
        option.addEventListener('focus', () => selectOption(index));
        option.addEventListener('click', () => selectOption(index));
    });
    introScreen.addEventListener('keydown', event => {
        if (document.getElementById('introActions').hidden) return;
        if (event.key === 'ArrowDown' || event.key.toLowerCase() === 's') {
            event.preventDefault();
            selectOption(selectedIndex + 1);
        } else if (event.key === 'ArrowUp' || event.key.toLowerCase() === 'w') {
            event.preventDefault();
            selectOption(selectedIndex - 1);
        } else if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            activateOption();
        }
    });
    introScreen.focus({ preventScroll: true });
}

function initializeParticleEffects() {
    const backgroundCanvas = document.getElementById("backgroundParticles");
    const titleCanvas = document.getElementById("titleParticles");
    const backgroundContext = backgroundCanvas.getContext("2d");
    const titleContext = titleCanvas.getContext("2d");
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const pointer = { x: -1000, y: -1000 };
    let backgroundParticles = [];
    let titleParticles = [];
    let pixelRatio = Math.min(window.devicePixelRatio || 1, 2);

    function createTitleParticles(width, height) {
        if (width <= 0 || height <= 0) {
            return [];
        }

        const offscreen = document.createElement("canvas");
        offscreen.width = Math.ceil(width * pixelRatio);
        offscreen.height = Math.ceil(height * pixelRatio);
        const context = offscreen.getContext("2d", { willReadFrequently: true });
        context.scale(pixelRatio, pixelRatio);
        context.fillStyle = "#fff";
        context.textAlign = "center";
        context.textBaseline = "middle";
        context.font = `900 ${Math.max(34, Math.min(width * 0.16, 132))}px system-ui, sans-serif`;
        context.fillText("TEST-HUB", width / 2, height / 2);

        const pixels = context.getImageData(0, 0, offscreen.width, offscreen.height).data;
        const particles = [];
        const sampleStep = Math.max(5, Math.round(pixelRatio * 3.5));
        for (let y = 0; y < offscreen.height; y += sampleStep) {
            for (let x = 0; x < offscreen.width; x += sampleStep) {
                if (pixels[(y * offscreen.width + x) * 4 + 3] > 128) {
                    const baseX = x / pixelRatio;
                    const baseY = y / pixelRatio;
                    particles.push({
                        x: baseX,
                        y: baseY,
                        baseX,
                        baseY,
                        radius: 1.2 + Math.random() * 0.8
                    });
                }
            }
        }
        return particles;
    }

    function resizeCanvases() {
        pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
        const backgroundWidth = window.innerWidth;
        const backgroundHeight = window.innerHeight;
        backgroundCanvas.width = Math.ceil(backgroundWidth * pixelRatio);
        backgroundCanvas.height = Math.ceil(backgroundHeight * pixelRatio);
        backgroundContext.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
        const backgroundCount = Math.min(240, Math.max(90, Math.round(backgroundWidth * backgroundHeight / 8500)));
        backgroundParticles = Array.from({ length: backgroundCount }, () => ({
            x: Math.random() * backgroundWidth,
            y: Math.random() * backgroundHeight,
            radius: 2 + Math.random() * 1.7,
            drift: (Math.random() - 0.5) * 0.12
        }));
        backgroundParticles.forEach(particle => {
            particle.baseX = particle.x;
            particle.baseY = particle.y;
        });

        const titleRect = titleCanvas.getBoundingClientRect();
        titleCanvas.width = Math.ceil(titleRect.width * pixelRatio);
        titleCanvas.height = Math.ceil(titleRect.height * pixelRatio);
        titleContext.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
        titleParticles = createTitleParticles(titleRect.width, titleRect.height);
    }

    function drawParticles(scheduleNextFrame = true) {
        const colors = getComputedStyle(document.body);
        const backgroundColor = colors.getPropertyValue("--background-particle-color").trim();
        const titleColor = colors.getPropertyValue("--particle-color").trim();

        backgroundContext.clearRect(0, 0, backgroundCanvas.width / pixelRatio, backgroundCanvas.height / pixelRatio);
        backgroundContext.fillStyle = backgroundColor;
        for (const particle of backgroundParticles) {
            if (!reducedMotion) {
                particle.baseX += particle.drift;
                if (particle.baseX < 0) particle.baseX = window.innerWidth;
                if (particle.baseX > window.innerWidth) particle.baseX = 0;
            }
            if (!reducedMotion) {
                const dx = particle.x - pointer.x;
                const dy = particle.y - pointer.y;
                const distance = Math.hypot(dx, dy);
                if (distance > 0 && distance < 105) {
                    const force = (105 - distance) * 0.018;
                    particle.x += (dx / distance) * force;
                    particle.y += (dy / distance) * force;
                }
                particle.x += (particle.baseX - particle.x) * 0.035;
                particle.y += (particle.baseY - particle.y) * 0.035;
            }
            backgroundContext.globalAlpha = 0.28 + particle.radius * 0.15;
            backgroundContext.beginPath();
            backgroundContext.arc(particle.x, particle.y, particle.radius, 0, Math.PI * 2);
            backgroundContext.fill();
        }
        backgroundContext.globalAlpha = 1;

        const titleRect = titleCanvas.getBoundingClientRect();
        const pointerX = pointer.x - titleRect.left;
        const pointerY = pointer.y - titleRect.top;
        titleContext.clearRect(0, 0, titleRect.width, titleRect.height);
        titleContext.fillStyle = titleColor;
        for (const particle of titleParticles) {
            if (!reducedMotion) {
                const dx = particle.x - pointerX;
                const dy = particle.y - pointerY;
                const distance = Math.hypot(dx, dy);
                if (distance > 0 && distance < 90) {
                    const force = (90 - distance) * 0.16;
                    particle.x += (dx / distance) * force;
                    particle.y += (dy / distance) * force;
                }
                particle.x += (particle.baseX - particle.x) * 0.08;
                particle.y += (particle.baseY - particle.y) * 0.08;
            }
            titleContext.beginPath();
            titleContext.arc(particle.x, particle.y, particle.radius, 0, Math.PI * 2);
            titleContext.fill();
        }

        if (!reducedMotion && scheduleNextFrame) {
            window.requestAnimationFrame(drawParticles);
        }
    }

    window.addEventListener("pointermove", event => {
        pointer.x = event.clientX;
        pointer.y = event.clientY;
    }, { passive: true });
    window.addEventListener("pointerleave", () => {
        pointer.x = -1000;
        pointer.y = -1000;
    });
    window.addEventListener("resize", () => {
        resizeCanvases();
        drawParticles(false);
    });
    window.addEventListener("particlevisibilitychange", () => {
        resizeCanvases();
        drawParticles(false);
    });
    window.addEventListener("themechange", () => drawParticles(false));
    resizeCanvases();
    drawParticles();
}

initializeParticleEffects();
listZones();
    </script>
</body>
